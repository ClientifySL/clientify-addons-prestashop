name: Release Module

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # El auto-updater instala el ultimo release en todas las tiendas, incluidas las
      # PrestaShop 1.7 con PHP 5.6: un error de sintaxis de PHP nuevo las rompe.
      - name: Setup PHP 5.6 (minimo de PrestaShop 1.7)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP 8.3
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Inject version into clientify.php and config.xml
        run: |
          sed -i "s/\\\$this->version = '[^']*';/\$this->version = '${{ steps.get_version.outputs.VERSION }}';/" clientify.php
          sed -i "s|<version><!\[CDATA\[[^]]*\]\]></version>|<version><![CDATA[${{ steps.get_version.outputs.VERSION }}]]></version>|" config.xml

      - name: Build module ZIP
        run: |
          mkdir -p build/clientify
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            . build/clientify/
          cd build
          zip -r ../clientify-v${{ steps.get_version.outputs.VERSION }}.zip clientify/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Clientify v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## Clientify PrestaShop Module v${{ steps.get_version.outputs.VERSION }}

            ### Instalación
            1. Descarga el archivo `clientify-v${{ steps.get_version.outputs.VERSION }}.zip`
            2. Ve a **Módulos → Gestión de Módulos → Subir módulo**
            3. Selecciona el ZIP descargado
          files: clientify-v${{ steps.get_version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
