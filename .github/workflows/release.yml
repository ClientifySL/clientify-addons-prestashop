# Publica una GitHub Release con el ZIP del módulo al pushear un tag `vX.Y.Z`.
#
# El módulo (en el servidor del cliente) consulta la API pública de releases de
# GitHub para auto-actualizarse: necesita que el repo sea PÚBLICO y que exista
# una release con el ZIP adjunto. Este workflow crea ese ZIP con la estructura
# que PrestaShop espera: una carpeta raíz `clientify/` (= nombre del módulo, con
# `clientify/clientify.php` como fichero principal).
#
# Estándar (repo público): runs-on de GitHub (NUNCA self-hosted — un PR desde un
# fork ejecutaría en nuestra infra) y SOLO el GITHUB_TOKEN automático.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # solo para crear la Release; nada más

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión desde el tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inyectar la versión en el módulo
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          # config.xml: <version><![CDATA[X.Y.Z]]></version>
          sed -i -E "s#(<version><!\[CDATA\[)[^]]*(\]\]></version>)#\1${V}\2#" config.xml
          # clientify.php: $this->version = 'X.Y.Z';
          sed -i -E "s#(\\\$this->version[[:space:]]*=[[:space:]]*')[^']*(';)#\1${V}\2#" clientify.php
          echo "  config.xml -> $(grep -oE '<version><!\[CDATA\[[^]]*' config.xml)"
          echo "  clientify.php -> $(grep -oE "\\\$this->version = '[^']*'" clientify.php)"

      - name: Empaquetar el ZIP (carpeta raíz clientify/)
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          mkdir -p build/clientify
          # copia todo el módulo menos lo que no debe ir a producción
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' \
                --exclude='*.md' --exclude='.gitignore' ./ build/clientify/
          cd build
          zip -rq "clientify-v${V}.zip" clientify
          echo "  contenido (top):"
          unzip -l "clientify-v${V}.zip" | grep 'clientify/' | head -5

      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            "build/clientify-v${V}.zip" \
            --title "v${V}" \
            --generate-notes
